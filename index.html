<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>منوی کافه سعدی</title>
<style>
:root{--bg:#9a3a20;--ink:#fff6e6;--gold:#ffe2a3}
*{box-sizing:border-box;margin:0}body{background:var(--bg) url(img/background.jpg) center/cover fixed;color:var(--ink);font-family:Vazirmatn,Tahoma,sans-serif;padding-bottom:40px}
header{text-align:center;padding:22px 16px 8px}header img{width:96px;height:96px;border-radius:50%}header h1{font-size:26px;margin-top:6px;color:var(--gold)}
nav{position:sticky;top:0;z-index:5;display:flex;gap:8px;overflow-x:auto;padding:10px 16px;background:rgba(110,30,12,.92);backdrop-filter:blur(6px)}
nav a{flex:none;color:var(--ink);text-decoration:none;padding:7px 14px;border:1px solid var(--gold);border-radius:999px;font-size:15px}
section{padding:18px 16px 0;max-width:1100px;margin:auto;scroll-margin-top:60px}h2{color:var(--gold);font-size:22px;margin-bottom:12px}
.g{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}@media(min-width:700px){.g{grid-template-columns:repeat(4,1fr)}}
figure{background:rgba(0,0,0,.18);border-radius:14px;overflow:hidden;cursor:pointer}figure img{width:100%;display:block}
figcaption{display:flex;justify-content:space-between;gap:6px;padding:8px 10px;font-size:14px}figcaption span{color:var(--gold);white-space:nowrap}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);display:none;align-items:center;justify-content:center;z-index:9}#lb img{max-width:96vw;max-height:94vh;border-radius:12px}
</style></head><body>
<header><img src="img/logo.png" alt="کافه سعدی"><h1>منوی کافه سعدی</h1></header>
<nav><a href="#hot">نوشیدنی‌های گرم</a><a href="#cold">نوشیدنی‌های سرد</a><a href="#juice">آبمیوه‌ها</a><a href="#shake">میلک‌شیک‌ها</a><a href="#cake">کیک و کروسان</a></nav><section id="hot"><h2>نوشیدنی‌های گرم</h2><div class="g"><figure data-full="img/cards/espresso.jpg"><img loading="lazy" src="img/thumb/espresso.jpg" alt="اسپرسو"><figcaption><b>اسپرسو</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/americano.jpg"><img loading="lazy" src="img/thumb/americano.jpg" alt="آمریکانو"><figcaption><b>آمریکانو</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/cappuccino.jpg"><img loading="lazy" src="img/thumb/cappuccino.jpg" alt="کاپوچینو"><figcaption><b>کاپوچینو</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/latte.jpg"><img loading="lazy" src="img/thumb/latte.jpg" alt="لاته"><figcaption><b>لاته</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/flat-white.jpg"><img loading="lazy" src="img/thumb/flat-white.jpg" alt="فلت وایت"><figcaption><b>فلت وایت</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/mocha.jpg"><img loading="lazy" src="img/thumb/mocha.jpg" alt="موکا"><figcaption><b>موکا</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/macchiato.jpg"><img loading="lazy" src="img/thumb/macchiato.jpg" alt="ماکیاتو"><figcaption><b>ماکیاتو</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/turkish-coffee.jpg"><img loading="lazy" src="img/thumb/turkish-coffee.jpg" alt="قهوه ترک"><figcaption><b>قهوه ترک</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/hot-chocolate.jpg"><img loading="lazy" src="img/thumb/hot-chocolate.jpg" alt="هات چاکلت"><figcaption><b>هات چاکلت</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/masala-chai.jpg"><img loading="lazy" src="img/thumb/masala-chai.jpg" alt="چای ماسالا"><figcaption><b>چای ماسالا</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure></div></section><section id="cold"><h2>نوشیدنی‌های سرد</h2><div class="g"><figure data-full="img/cards/iced-americano.jpg"><img loading="lazy" src="img/thumb/iced-americano.jpg" alt="آیس آمریکانو"><figcaption><b>آیس آمریکانو</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/iced-latte.jpg"><img loading="lazy" src="img/thumb/iced-latte.jpg" alt="آیس لاته"><figcaption><b>آیس لاته</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/iced-caramel-latte.jpg"><img loading="lazy" src="img/thumb/iced-caramel-latte.jpg" alt="آیس کارامل لاته"><figcaption><b>آیس کارامل لاته</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/iced-mocha.jpg"><img loading="lazy" src="img/thumb/iced-mocha.jpg" alt="آیس موکا"><figcaption><b>آیس موکا</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/cold-brew.jpg"><img loading="lazy" src="img/thumb/cold-brew.jpg" alt="کلد برو"><figcaption><b>کلد برو</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/caramel-frappe.jpg"><img loading="lazy" src="img/thumb/caramel-frappe.jpg" alt="کارامل فراپه"><figcaption><b>کارامل فراپه</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/iced-matcha.jpg"><img loading="lazy" src="img/thumb/iced-matcha.jpg" alt="آیس ماچا"><figcaption><b>آیس ماچا</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/iced-strawberry-matcha.jpg"><img loading="lazy" src="img/thumb/iced-strawberry-matcha.jpg" alt="آیس ماچا توت‌فرنگی"><figcaption><b>آیس ماچا توت‌فرنگی</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/peach-iced-tea.jpg"><img loading="lazy" src="img/thumb/peach-iced-tea.jpg" alt="چای سرد هلو"><figcaption><b>چای سرد هلو</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/classic-mojito.jpg"><img loading="lazy" src="img/thumb/classic-mojito.jpg" alt="موهیتو کلاسیک"><figcaption><b>موهیتو کلاسیک</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure></div></section><section id="juice"><h2>آبمیوه‌ها</h2><div class="g"><figure data-full="img/cards/orange-juice.jpg"><img loading="lazy" src="img/thumb/orange-juice.jpg" alt="آب‌پرتقال"><figcaption><b>آب‌پرتقال</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/strawberry-juice.jpg"><img loading="lazy" src="img/thumb/strawberry-juice.jpg" alt="آب توت‌فرنگی"><figcaption><b>آب توت‌فرنگی</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/mango-juice.jpg"><img loading="lazy" src="img/thumb/mango-juice.jpg" alt="آب انبه"><figcaption><b>آب انبه</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/pomegranate-juice.jpg"><img loading="lazy" src="img/thumb/pomegranate-juice.jpg" alt="آب انار"><figcaption><b>آب انار</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/watermelon-juice.jpg"><img loading="lazy" src="img/thumb/watermelon-juice.jpg" alt="آب هندوانه"><figcaption><b>آب هندوانه</b><span>۱۵۰٬۰۰۰ تومان</span></figcaption></figure></div></section><section id="shake"><h2>میلک‌شیک‌ها</h2><div class="g"><figure data-full="img/cards/chocolate-shake.jpg"><img loading="lazy" src="img/thumb/chocolate-shake.jpg" alt="میلک‌شیک شکلات"><figcaption><b>میلک‌شیک شکلات</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/strawberry-shake.jpg"><img loading="lazy" src="img/thumb/strawberry-shake.jpg" alt="میلک‌شیک توت‌فرنگی"><figcaption><b>میلک‌شیک توت‌فرنگی</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/oreo-shake.jpg"><img loading="lazy" src="img/thumb/oreo-shake.jpg" alt="میلک‌شیک اوریو"><figcaption><b>میلک‌شیک اوریو</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/pistachio-shake.jpg"><img loading="lazy" src="img/thumb/pistachio-shake.jpg" alt="میلک‌شیک پسته"><figcaption><b>میلک‌شیک پسته</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/lotus-shake.jpg"><img loading="lazy" src="img/thumb/lotus-shake.jpg" alt="میلک‌شیک لوتوس"><figcaption><b>میلک‌شیک لوتوس</b><span>۲۰۰٬۰۰۰ تومان</span></figcaption></figure></div></section><section id="cake"><h2>کیک و کروسان</h2><div class="g"><figure data-full="img/cards/plain-croissant.jpg"><img loading="lazy" src="img/thumb/plain-croissant.jpg" alt="کروسان ساده"><figcaption><b>کروسان ساده</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/chocolate-croissant.jpg"><img loading="lazy" src="img/thumb/chocolate-croissant.jpg" alt="کروسان شکلات"><figcaption><b>کروسان شکلات</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/almond-croissant.jpg"><img loading="lazy" src="img/thumb/almond-croissant.jpg" alt="کروسان بادام"><figcaption><b>کروسان بادام</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/cheese-croissant.jpg"><img loading="lazy" src="img/thumb/cheese-croissant.jpg" alt="کروسان پنیر"><figcaption><b>کروسان پنیر</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/ny-cheesecake.jpg"><img loading="lazy" src="img/thumb/ny-cheesecake.jpg" alt="چیزکیک نیویورکی"><figcaption><b>چیزکیک نیویورکی</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/san-sebastian.jpg"><img loading="lazy" src="img/thumb/san-sebastian.jpg" alt="چیزکیک سن‌سباستین"><figcaption><b>چیزکیک سن‌سباستین</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/lotus-cheesecake.jpg"><img loading="lazy" src="img/thumb/lotus-cheesecake.jpg" alt="چیزکیک لوتوس"><figcaption><b>چیزکیک لوتوس</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/tiramisu.jpg"><img loading="lazy" src="img/thumb/tiramisu.jpg" alt="تیرامیسو"><figcaption><b>تیرامیسو</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/red-velvet.jpg"><img loading="lazy" src="img/thumb/red-velvet.jpg" alt="کیک رد ولوت"><figcaption><b>کیک رد ولوت</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/carrot-cake.jpg"><img loading="lazy" src="img/thumb/carrot-cake.jpg" alt="کیک هویج"><figcaption><b>کیک هویج</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/brownie.jpg"><img loading="lazy" src="img/thumb/brownie.jpg" alt="براونی"><figcaption><b>براونی</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/lava-cake.jpg"><img loading="lazy" src="img/thumb/lava-cake.jpg" alt="کیک لاوا"><figcaption><b>کیک لاوا</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/banana-bread.jpg"><img loading="lazy" src="img/thumb/banana-bread.jpg" alt="کیک موز"><figcaption><b>کیک موز</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/cinnamon-roll.jpg"><img loading="lazy" src="img/thumb/cinnamon-roll.jpg" alt="رول دارچین"><figcaption><b>رول دارچین</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure><figure data-full="img/cards/chocolate-cake.jpg"><img loading="lazy" src="img/thumb/chocolate-cake.jpg" alt="کیک شکلاتی"><figcaption><b>کیک شکلاتی</b><span>۱۰۰٬۰۰۰ تومان</span></figcaption></figure></div></section>
<div id="lb"><img alt=""></div>
<script>const lb=document.getElementById('lb'),li=lb.querySelector('img');document.querySelectorAll('figure').forEach(f=>f.onclick=()=>{li.src=f.dataset.full;lb.style.display='flex'});lb.onclick=()=>lb.style.display='none'</script>
</body></html>
